<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Ilustrador</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header>
    <img class="logo" src="./recursos/myairbridge-BCTRZmbL9RO/freddo-logo.png" alt="Logo freddo">
    <nav>
    <button id="menu-toggle" class="menu-toggle">☰</button>
    
    <ul id="menu" class="menu"> 
        <li><a href="./index.html">Home</a></li>
        <li><a href="./about.html">About</a></li>
        <li><a href="./digital.html">Digital</a></li>
        <li><a href="./contact.html">Contact</a></li>
    </ul>
    </nav>
    </header>
    
    <main>
    <section class="contact-section">
        
        <div class="contact-container">
            
            <div class="contact-info">
                
                <div class="logo-decoration">
                    <img src="./recursos/myairbridge-BCTRZmbL9RO/icono-rostro.png" alt="Icono de contacto">
                </div>
                
                <p class="contact-headline">
                    SI TIENES UNA IDEA EN MENTE, UN PROYECTO ESPECIAL O SIMPLEMENTE BUSCAS ALGO ÚNICO, NO DUDES EN ESCRIBIRME. 
                    <span class="highlight">¡HAGAMOS MAGIA JUNTOS!</span>
                </p>
            </div>

            <div class="contact-form-wrapper">
                <form class="contact-form">
                    <h3>Contact us</h3>
                    
                    <div class="form-group full-width">
                        <label for="email">EMAIL *</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <div class="form-group full-width">
                        <label for="telefono">TELÉFONO</label>
                        <input type="tel" id="telefono" name="telefono">
                    </div>

                    <div class="form-group full-width">
                        <label for="mensaje">WRITE A MESSAGE</label>
                        <textarea id="mensaje" name="mensaje" rows="5"></textarea>
                    </div>
                    
                    <button type="submit" class="submit-button">Submit</button>
                </form>

                <div class="social-icons">
                    <a href="#"><img src="./recursos/whatsapp.png" alt="WhatsApp"></a>
                    <a href="#"><img src="./recursos/instagram.png" alt="Instagram"></a>
                    <a href="#"><img src="./recursos/tiktok.png" alt="TikTok"></a>
                    <a href="#"><img src="./recursos/telegram.png" alt="Telegram"></a>
                    <a href="#"><img src="./recursos/behance.png" alt="Behance"></a>
                </div>
            </div>

        </div>
    </section>
</main>


</footer>
    
    <script src="./menu.js"></script>
</body>
</html>
