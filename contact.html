<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Ilustrador</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header>
        <img class="logo" src="./recursos/myairbridge-BCTRZmbL9RO/freddo-logo.png" alt="Logo freddo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="digital.html">Digital</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>
    
    <main>
        <section class="contact-section">
            <p class="contact-text">Si tienes una idea en mente, un proyecto especial o simplemente buscas algo único, no dudes en escribirme. ¡Hagamos magia juntos!</p>
            <div class="contact-container">
                <div class="contact-image">
                    <img src="./recursos/myairbridge-BCTRZmbL9RO/icono-rostro.png" alt="Icono de contacto">
                </div>
                <div class="contact-form">
                    <h2>Contact Us</h2>
                    <form>
                        <label for="email">Email</label>
                        <input type="email" name="email" placeholder="Email" required>
                        <label for="email">Telefono</label>
                        <input type="tel" name="telefono" placeholder="Teléfono" required>
                        <label for="email">Mensaje</label>
                        <textarea name="mensaje" placeholder="Write message" required></textarea>
                        <button type="submit">Enviar</button>
                    </form>
                    <div class="social-icons">
                        <a href="#"><img src="icon-facebook.png" alt="Facebook"></a>
                        <a href="#"><img src="icon-instagram.png" alt="Instagram"></a>
                        <a href="#"><img src="icon-twitter.png" alt="Twitter"></a>
                    </div>
                </div>
            </div>
        </section>
    </main>
    
    <footer>
        <button id="ver-mas" class="eye-button">👁 Ver más</button>
    </footer>
    
    <script src="script.js"></script>
</body>
</html>
